<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">上網速度，經過不只一個環節</title><desc id="desc">任何一段都可能影響體驗；單次測速不足以確診。</desc><rect width="1200" height="620" rx="28" fill="#f3f8f5"/><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="58" y="70" text-anchor="start" font-size="18" font-weight="700" fill="#678b7f">居家網路 / CONNECTION</text><text x="58" y="128" text-anchor="start" font-size="42" font-weight="700" fill="#173e3b">上網速度，經過不只一個環節</text><text x="58" y="167" text-anchor="start" font-size="21" font-weight="500" fill="#55746b">先比較不同位置，再判斷問題可能在哪一段。</text><path d="M360 345 L405 345" fill="none" stroke="#729d90" stroke-width="4" /><text x="383" y="352" text-anchor="middle" font-size="36" font-weight="700" fill="#719b8d">›</text><path d="M690 345 L735 345" fill="none" stroke="#729d90" stroke-width="4" /><text x="713" y="352" text-anchor="middle" font-size="36" font-weight="700" fill="#719b8d">›</text><rect x="70" y="245" width="290" height="200" rx="22" fill="#ffffff" stroke="#d0e3dc" stroke-width="2"/><circle cx="215.0" cy="300" r="29" fill="#e5f4ed"/><text x="215.0" y="310" text-anchor="middle" font-size="31" font-weight="700" fill="#397460">網</text><text x="215.0" y="367" text-anchor="middle" font-size="28" font-weight="700" fill="#193b3c">網路方案</text><text x="215.0" y="407" text-anchor="middle" font-size="19" font-weight="500" fill="#4f6a65">外部線路與服務</text><rect x="400" y="245" width="290" height="200" rx="22" fill="#ffffff" stroke="#d0e3dc" stroke-width="2"/><circle cx="545.0" cy="300" r="29" fill="#e5f4ed"/><text x="545.0" y="310" text-anchor="middle" font-size="31" font-weight="700" fill="#397460">路</text><text x="545.0" y="367" text-anchor="middle" font-size="28" font-weight="700" fill="#193b3c">路由器</text><text x="545.0" y="407" text-anchor="middle" font-size="19" font-weight="500" fill="#4f6a65">有線 / 無線網路</text><rect x="730" y="245" width="290" height="200" rx="22" fill="#ffffff" stroke="#d0e3dc" stroke-width="2"/><circle cx="875.0" cy="300" r="29" fill="#e5f4ed"/><text x="875.0" y="310" text-anchor="middle" font-size="31" font-weight="700" fill="#397460">端</text><text x="875.0" y="367" text-anchor="middle" font-size="28" font-weight="700" fill="#193b3c">你的裝置</text><text x="875.0" y="407" text-anchor="middle" font-size="19" font-weight="500" fill="#4f6a65">手機、電腦與使用位置</text><path d="M58 548 H1142" stroke="#d5e7df" stroke-width="2"/><text x="58" y="584" text-anchor="start" font-size="18" font-weight="500" fill="#58756c">任何一段都可能影響體驗；單次測速不足以確診。</text><text x="1140" y="584" text-anchor="end" font-size="16" font-weight="700" fill="#698b80">WILSONSPEAK / 圖解</text></g></svg>