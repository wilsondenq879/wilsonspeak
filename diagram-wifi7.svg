<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">BE 數字怎麼看？</title><desc id="desc">示意圖未按比例呈現速率；實測還受設備、距離與網路方案影響。</desc><rect width="1200" height="620" rx="28" fill="#f3f8f5"/><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="58" y="70" text-anchor="start" font-size="18" font-weight="700" fill="#678b7f">選購指南 / WI-FI 7</text><text x="58" y="128" text-anchor="start" font-size="42" font-weight="700" fill="#173e3b">BE 數字怎麼看？</text><text x="58" y="167" text-anchor="start" font-size="21" font-weight="500" fill="#55746b">不同產品使用的頻段與規格不同，請查看實際規格表。</text><rect x="70" y="247" width="460" height="210" rx="22" fill="#ffffff" stroke="#d0e3dc" stroke-width="2"/><text x="300" y="302" text-anchor="middle" font-size="26" font-weight="700" fill="#193b3c">路由器的不同頻段</text><text x="100" y="342" text-anchor="start" font-size="19" font-weight="500" fill="#55746b">2.4 GHz</text><rect x="235" y="321" width="170" height="22" rx="10" fill="#9fcbb5" stroke="#9fcbb5" stroke-width="2"/><text x="100" y="382" text-anchor="start" font-size="19" font-weight="500" fill="#55746b">5 GHz</text><rect x="235" y="361" width="250" height="22" rx="10" fill="#66aa92" stroke="#66aa92" stroke-width="2"/><text x="100" y="422" text-anchor="start" font-size="19" font-weight="500" fill="#55746b">其他支援頻段</text><rect x="235" y="401" width="200" height="22" rx="10" fill="#c3d9cf" stroke="#c3d9cf" stroke-width="2"/><text x="600" y="365" text-anchor="middle" font-size="48" font-weight="700" fill="#709e8d">→</text><rect x="670" y="247" width="450" height="210" rx="22" fill="#e5f3ec" stroke="#cfe4da" stroke-width="2"/><text x="895" y="317" text-anchor="middle" font-size="30" font-weight="700" fill="#193b3c">盒上 BE 數字</text><text x="895" y="362" text-anchor="middle" font-size="24" font-weight="500" fill="#193b3c">各頻段理論速率加總</text><text x="895" y="412" text-anchor="middle" font-size="24" font-weight="700" fill="#a04f35">不等於手機實際網速</text><path d="M58 548 H1142" stroke="#d5e7df" stroke-width="2"/><text x="58" y="584" text-anchor="start" font-size="18" font-weight="500" fill="#58756c">示意圖未按比例呈現速率；實測還受設備、距離與網路方案影響。</text><text x="1140" y="584" text-anchor="end" font-size="16" font-weight="700" fill="#698b80">WILSONSPEAK / 圖解</text></g></svg>