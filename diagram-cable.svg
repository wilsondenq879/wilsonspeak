<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">網路變慢，不一定是海纜</title><desc id="desc">海纜故障的影響取決於路線、容量、備援與各業者網路配置。</desc><rect width="1200" height="620" rx="28" fill="#f3f8f5"/><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="58" y="70" text-anchor="start" font-size="18" font-weight="700" fill="#678b7f">網路原理 / SUBMARINE CABLE</text><text x="58" y="128" text-anchor="start" font-size="42" font-weight="700" fill="#173e3b">網路變慢，不一定是海纜</text><text x="58" y="167" text-anchor="start" font-size="21" font-weight="500" fill="#55746b">從家中網路一路往外查，對照同一時段的其他服務。</text><rect x="70" y="245" width="310" height="190" rx="22" fill="#ffffff" stroke="#d0e3dc" stroke-width="2"/><text x="225" y="310" text-anchor="middle" font-size="28" font-weight="700" fill="#193b3c">你的裝置</text><text x="225" y="360" text-anchor="middle" font-size="20" font-weight="500" fill="#55746b">先比較 Wi-Fi 與有線</text><rect x="445" y="245" width="310" height="190" rx="22" fill="#ffffff" stroke="#d0e3dc" stroke-width="2"/><text x="600" y="310" text-anchor="middle" font-size="28" font-weight="700" fill="#193b3c">電信業者</text><text x="600" y="360" text-anchor="middle" font-size="20" font-weight="500" fill="#55746b">查看公告與連線狀態</text><rect x="820" y="245" width="310" height="190" rx="22" fill="#ffffff" stroke="#d0e3dc" stroke-width="2"/><text x="975" y="310" text-anchor="middle" font-size="28" font-weight="700" fill="#193b3c">國際路由</text><text x="975" y="360" text-anchor="middle" font-size="20" font-weight="500" fill="#55746b">比對方向與備援路線</text><path d="M380 340 L445 340" fill="none" stroke="#729d90" stroke-width="4" /><path d="M755 340 L820 340" fill="none" stroke="#729d90" stroke-width="4" /><path d="M58 548 H1142" stroke="#d5e7df" stroke-width="2"/><text x="58" y="584" text-anchor="start" font-size="18" font-weight="500" fill="#58756c">海纜故障的影響取決於路線、容量、備援與各業者網路配置。</text><text x="1140" y="584" text-anchor="end" font-size="16" font-weight="700" fill="#698b80">WILSONSPEAK / 圖解</text></g></svg>