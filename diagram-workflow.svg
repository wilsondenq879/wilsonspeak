<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">讓 AI 參與剪片：分階段檢查</title><desc id="desc">AI 可協助整理與執行，內容正確性與最終品質仍需確認。</desc><rect width="1200" height="620" rx="28" fill="#f3f8f5"/><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="58" y="70" text-anchor="start" font-size="18" font-weight="700" fill="#678b7f">AI 工作流 / VIDEO</text><text x="58" y="128" text-anchor="start" font-size="42" font-weight="700" fill="#173e3b">讓 AI 參與剪片：分階段檢查</text><text x="58" y="167" text-anchor="start" font-size="21" font-weight="500" fill="#55746b">先規劃，再整理素材和製作；發布前保留人工確認。</text><path d="M360 345 L405 345" fill="none" stroke="#729d90" stroke-width="4" /><text x="383" y="352" text-anchor="middle" font-size="36" font-weight="700" fill="#719b8d">›</text><path d="M690 345 L735 345" fill="none" stroke="#729d90" stroke-width="4" /><text x="713" y="352" text-anchor="middle" font-size="36" font-weight="700" fill="#719b8d">›</text><rect x="70" y="245" width="290" height="200" rx="22" fill="#ffffff" stroke="#d0e3dc" stroke-width="2"/><circle cx="215.0" cy="300" r="29" fill="#e5f4ed"/><text x="215.0" y="310" text-anchor="middle" font-size="31" font-weight="700" fill="#397460">稿</text><text x="215.0" y="367" text-anchor="middle" font-size="28" font-weight="700" fill="#193b3c">① 規劃</text><text x="215.0" y="407" text-anchor="middle" font-size="19" font-weight="500" fill="#4f6a65">大綱、逐字稿、分鏡</text><rect x="400" y="245" width="290" height="200" rx="22" fill="#ffffff" stroke="#d0e3dc" stroke-width="2"/><circle cx="545.0" cy="300" r="29" fill="#e5f4ed"/><text x="545.0" y="310" text-anchor="middle" font-size="31" font-weight="700" fill="#397460">剪</text><text x="545.0" y="367" text-anchor="middle" font-size="28" font-weight="700" fill="#193b3c">② 製作</text><text x="545.0" y="407" text-anchor="middle" font-size="19" font-weight="500" fill="#4f6a65">素材索引與剪輯</text><rect x="730" y="245" width="290" height="200" rx="22" fill="#ffffff" stroke="#d0e3dc" stroke-width="2"/><circle cx="875.0" cy="300" r="29" fill="#e5f4ed"/><text x="875.0" y="310" text-anchor="middle" font-size="31" font-weight="700" fill="#397460">✓</text><text x="875.0" y="367" text-anchor="middle" font-size="28" font-weight="700" fill="#193b3c">③ 檢查</text><text x="875.0" y="407" text-anchor="middle" font-size="19" font-weight="500" fill="#4f6a65">人工審核、QA、發布</text><path d="M58 548 H1142" stroke="#d5e7df" stroke-width="2"/><text x="58" y="584" text-anchor="start" font-size="18" font-weight="500" fill="#58756c">AI 可協助整理與執行，內容正確性與最終品質仍需確認。</text><text x="1140" y="584" text-anchor="end" font-size="16" font-weight="700" fill="#698b80">WILSONSPEAK / 圖解</text></g></svg>