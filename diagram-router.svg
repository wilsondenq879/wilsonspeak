<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">路由器與交換器，各做什麼？</title><desc id="desc">實際設備功能因型號而異；圖示省略了部分設備與設定。</desc><rect width="1200" height="620" rx="28" fill="#f3f8f5"/><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="58" y="70" text-anchor="start" font-size="18" font-weight="700" fill="#678b7f">網路基礎 / ROUTER &amp; SWITCH</text><text x="58" y="128" text-anchor="start" font-size="42" font-weight="700" fill="#173e3b">路由器與交換器，各做什麼？</text><text x="58" y="167" text-anchor="start" font-size="21" font-weight="500" fill="#55746b">家用情境：路由器連外，交換器讓更多設備接網路線。</text><path d="M420 330 L540 330" fill="none" stroke="#729d90" stroke-width="4" /><path d="M755 330 L850 270" fill="none" stroke="#729d90" stroke-width="4" /><path d="M755 330 L850 390" fill="none" stroke="#729d90" stroke-width="4" /><rect x="80" y="230" width="300" height="200" rx="22" fill="#ffffff" stroke="#d0e3dc" stroke-width="2"/><circle cx="230.0" cy="285" r="29" fill="#e5f4ed"/><text x="230.0" y="295" text-anchor="middle" font-size="31" font-weight="700" fill="#397460">路</text><text x="230.0" y="352" text-anchor="middle" font-size="28" font-weight="700" fill="#193b3c">路由器</text><text x="230.0" y="392" text-anchor="middle" font-size="19" font-weight="500" fill="#4f6a65">連接不同網路</text><rect x="540" y="230" width="220" height="200" rx="22" fill="#ffffff" stroke="#d0e3dc" stroke-width="2"/><circle cx="650.0" cy="285" r="29" fill="#e5f4ed"/><text x="650.0" y="295" text-anchor="middle" font-size="31" font-weight="700" fill="#397460">交</text><text x="650.0" y="352" text-anchor="middle" font-size="28" font-weight="700" fill="#193b3c">交換器</text><text x="650.0" y="392" text-anchor="middle" font-size="19" font-weight="500" fill="#4f6a65">擴充有線埠</text><rect x="850" y="235" width="250" height="65" rx="22" fill="#ffffff" stroke="#d0e3dc" stroke-width="2"/><text x="975" y="277" text-anchor="middle" font-size="24" font-weight="700" fill="#193b3c">電腦</text><rect x="850" y="355" width="250" height="65" rx="22" fill="#ffffff" stroke="#d0e3dc" stroke-width="2"/><text x="975" y="397" text-anchor="middle" font-size="24" font-weight="700" fill="#193b3c">NAS</text><path d="M58 548 H1142" stroke="#d5e7df" stroke-width="2"/><text x="58" y="584" text-anchor="start" font-size="18" font-weight="500" fill="#58756c">實際設備功能因型號而異；圖示省略了部分設備與設定。</text><text x="1140" y="584" text-anchor="end" font-size="16" font-weight="700" fill="#698b80">WILSONSPEAK / 圖解</text></g></svg>