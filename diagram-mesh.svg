<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">節點不是放進死角</title><desc id="desc">無線回程需要良好訊號；若採有線回程，仍需測試實際環境。</desc><rect width="1200" height="620" rx="28" fill="#f3f8f5"/><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="58" y="70" text-anchor="start" font-size="18" font-weight="700" fill="#678b7f">MESH WI-FI / PLACEMENT</text><text x="58" y="128" text-anchor="start" font-size="42" font-weight="700" fill="#173e3b">節點不是放進死角</text><text x="58" y="167" text-anchor="start" font-size="21" font-weight="500" fill="#55746b">先讓節點收到穩定訊號，才有機會延伸到房間。</text><path d="M215 332 L575 332" fill="none" stroke="#729d90" stroke-width="4" /><path d="M625 332 L985 332" fill="none" stroke="#729d90" stroke-width="4" /><rect x="70" y="235" width="290" height="200" rx="22" fill="#ffffff" stroke="#d0e3dc" stroke-width="2"/><circle cx="215.0" cy="290" r="29" fill="#e5f4ed"/><text x="215.0" y="300" text-anchor="middle" font-size="31" font-weight="700" fill="#397460">主</text><text x="215.0" y="357" text-anchor="middle" font-size="28" font-weight="700" fill="#193b3c">主路由器</text><text x="215.0" y="397" text-anchor="middle" font-size="19" font-weight="500" fill="#4f6a65">先放在較開闊的位置</text><rect x="455" y="235" width="290" height="200" rx="22" fill="#ffffff" stroke="#d0e3dc" stroke-width="2"/><circle cx="600.0" cy="290" r="29" fill="#e5f4ed"/><text x="600.0" y="300" text-anchor="middle" font-size="31" font-weight="700" fill="#397460">節</text><text x="600.0" y="357" text-anchor="middle" font-size="28" font-weight="700" fill="#193b3c">Mesh 節點</text><text x="600.0" y="397" text-anchor="middle" font-size="19" font-weight="500" fill="#4f6a65">放在仍能收到好訊號處</text><rect x="840" y="235" width="290" height="200" rx="22" fill="#ffffff" stroke="#d0e3dc" stroke-width="2"/><circle cx="985.0" cy="290" r="29" fill="#e5f4ed"/><text x="985.0" y="300" text-anchor="middle" font-size="31" font-weight="700" fill="#397460">房</text><text x="985.0" y="357" text-anchor="middle" font-size="28" font-weight="700" fill="#193b3c">弱訊號房間</text><text x="985.0" y="397" text-anchor="middle" font-size="19" font-weight="500" fill="#4f6a65">觀察實際連線改善</text><text x="405" y="300" text-anchor="middle" font-size="19" font-weight="500" fill="#507a6b">回程連線</text><text x="795" y="300" text-anchor="middle" font-size="19" font-weight="500" fill="#507a6b">提供覆蓋</text><path d="M58 548 H1142" stroke="#d5e7df" stroke-width="2"/><text x="58" y="584" text-anchor="start" font-size="18" font-weight="500" fill="#58756c">無線回程需要良好訊號；若採有線回程，仍需測試實際環境。</text><text x="1140" y="584" text-anchor="end" font-size="16" font-weight="700" fill="#698b80">WILSONSPEAK / 圖解</text></g></svg>